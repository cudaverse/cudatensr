on:
  workflow_dispatch:

name: cran-readiness

permissions:
  contents: read

jobs:
  source-candidate:
    name: R-devel full CRAN candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::spelling, any::urlchecker, any::tinytex
          needs: check
          dependencies: '"all"'

      - name: Install the HTML manual validator
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends tidy

      - name: Require a clean spelling inventory
        shell: Rscript {0}
        run: |
          findings <- spelling::spell_check_package(".")
          if (nrow(findings)) {
            print(findings)
            stop("Unreviewed spelling findings remain.", call. = FALSE)
          }

      - name: Require current package URLs
        shell: Rscript {0}
        run: |
          urlchecker::url_check(".", progress = FALSE, fail = TRUE)

      - name: Build the source candidate
        shell: bash
        run: |
          mkdir candidate
          R CMD build .
          mv cudatensr_*.tar.gz candidate/

      - name: Build and retain the reference manual
        shell: bash
        run: |
          mkdir -p candidate/source candidate/manual-build
          tar -xzf candidate/cudatensr_*.tar.gz -C candidate/source
          set +e
          R CMD Rd2pdf \
            --no-clean \
            --no-preview \
            --force \
            --build-dir=candidate/manual-build \
            --output=candidate/cudatensr-manual.pdf \
            candidate/source/cudatensr
          manual_status=$?
          set -e
          if [ "$manual_status" -ne 0 ]; then
            Rscript -e \
              'tinytex::parse_install("candidate/manual-build/Rd2.log")'
            R CMD Rd2pdf \
              --no-clean \
              --no-preview \
              --force \
              --build-dir=candidate/manual-build \
              --output=candidate/cudatensr-manual.pdf \
              candidate/source/cudatensr
          fi

      - name: Run the full CRAN-style check
        shell: bash
        run: |
          R CMD check --as-cran candidate/cudatensr_*.tar.gz

      - name: Upload the exact candidate and check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cudatensr-cran-candidate-${{ github.sha }}
          path: |
            candidate/cudatensr_*.tar.gz
            candidate/cudatensr-manual.pdf
            candidate/manual-build/**
            cudatensr.Rcheck/00check.log
            cudatensr.Rcheck/cudatensr-manual.pdf
            cudatensr.Rcheck/*.log
            cudatensr.Rcheck/*.tex
          if-no-files-found: warn
          retention-days: 14
