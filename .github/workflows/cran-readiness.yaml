on:
  workflow_dispatch:

name: cran-readiness

permissions:
  contents: read

jobs:
  source-candidate:
    name: R-devel full CRAN candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::spelling, any::urlchecker
          needs: check
          dependencies: '"all"'

      - name: Require a clean spelling inventory
        shell: Rscript {0}
        run: |
          findings <- spelling::spell_check_package(".")
          if (nrow(findings)) {
            print(findings)
            stop("Unreviewed spelling findings remain.", call. = FALSE)
          }

      - name: Require current package URLs
        shell: Rscript {0}
        run: |
          urlchecker::url_check(".", progress = FALSE, fail = TRUE)

      - name: Build the source candidate
        shell: bash
        run: |
          mkdir candidate
          R CMD build .
          mv cudatensr_*.tar.gz candidate/

      - name: Run the full CRAN-style check
        shell: bash
        run: |
          R CMD check --as-cran candidate/cudatensr_*.tar.gz

      - name: Upload the exact candidate and check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cudatensr-cran-candidate-${{ github.sha }}
          path: |
            candidate/cudatensr_*.tar.gz
            cudatensr.Rcheck/00check.log
            cudatensr.Rcheck/cudatensr-manual.pdf
          if-no-files-found: warn
          retention-days: 14
