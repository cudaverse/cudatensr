on:
  workflow_dispatch:

name: cran-readiness

permissions:
  contents: read

jobs:
  source-candidate:
    name: R-release source candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::spelling, any::urlchecker
          needs: check
          dependencies: '"all"'

      - name: Require a clean spelling inventory
        shell: Rscript {0}
        run: |
          findings <- spelling::spell_check_package(".")
          if (nrow(findings)) {
            print(findings)
            stop("Unreviewed spelling findings remain.", call. = FALSE)
          }

      - name: Require current package URLs
        shell: Rscript {0}
        run: |
          urlchecker::url_check(".", progress = FALSE, fail = TRUE)

      - name: Build the source candidate
        shell: bash
        run: |
          mkdir candidate
          R CMD build .
          mv cudaverse_*.tar.gz candidate/
          {
            echo "source_sha=${GITHUB_SHA}"
            Rscript -e 'cat("builder=", R.version.string, "\n", sep = "")'
            sha256sum candidate/cudaverse_*.tar.gz
          } > candidate/source-provenance.txt

      - name: Transfer the exact source candidate
        uses: actions/upload-artifact@v7
        with:
          name: cudaverse-source-candidate-${{ github.sha }}
          path: |
            candidate/cudaverse_*.tar.gz
            candidate/source-provenance.txt
          if-no-files-found: error
          retention-days: 1

  r-devel-check:
    name: R-devel full CRAN check
    needs: source-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::tinytex
          needs: check
          dependencies: '"all"'

      - name: Install the CRAN manual indexer
        shell: Rscript {0}
        run: |
          if (!nzchar(Sys.which("makeindex"))) {
            tinytex::tlmgr_install("makeindex")
            tinytex::tlmgr_path("add")
          }
          stopifnot(nzchar(Sys.which("makeindex")))

      - name: Install the HTML manual validator
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends tidy

      - name: Download the exact source candidate
        uses: actions/download-artifact@v8
        with:
          name: cudaverse-source-candidate-${{ github.sha }}
          path: candidate

      - name: Require one source candidate
        shell: bash
        run: |
          mapfile -t candidates < <(find candidate -maxdepth 1 -type f \
            -name 'cudaverse_*.tar.gz' -print)
          if [ "${#candidates[@]}" -ne 1 ]; then
            printf 'Expected one source candidate, found %s\n' \
              "${#candidates[@]}" >&2
            exit 1
          fi
          sha256sum --check <(tail -n 1 candidate/source-provenance.txt)

      - name: Build and retain the reference manual
        shell: bash
        run: |
          mkdir -p candidate/source candidate/manual-build
          tar -xzf candidate/cudaverse_*.tar.gz -C candidate/source
          set +e
          R CMD Rd2pdf \
            --no-clean \
            --no-preview \
            --force \
            --build-dir=candidate/manual-build \
            --output=candidate/cudaverse-manual.pdf \
            candidate/source/cudaverse
          manual_status=$?
          set -e
          if [ "$manual_status" -ne 0 ]; then
            Rscript -e \
              'tinytex::parse_install("candidate/manual-build/Rd2.log")'
            R CMD Rd2pdf \
              --no-clean \
              --no-preview \
              --force \
              --build-dir=candidate/manual-build \
              --output=candidate/cudaverse-manual.pdf \
              candidate/source/cudaverse
          fi

      - name: Run the full CRAN-style check
        shell: bash
        run: |
          R CMD check --as-cran candidate/cudaverse_*.tar.gz

      - name: Upload the exact candidate and check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cudaverse-cran-candidate-${{ github.sha }}
          path: |
            candidate/cudaverse_*.tar.gz
            candidate/source-provenance.txt
            candidate/cudaverse-manual.pdf
            candidate/manual-build/**
            cudaverse.Rcheck/00check.log
            cudaverse.Rcheck/cudaverse-manual.pdf
            cudaverse.Rcheck/*.log
            cudaverse.Rcheck/*.tex
          if-no-files-found: warn
          retention-days: 14
